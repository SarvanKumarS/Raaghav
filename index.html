<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Employee Travel Details Form</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <form id="travelForm">
      <h1>Employee Travel Information Form</h1>

      <div class="form-grid">
        <div class="field">
          <label for="name">1. Name</label>
          <input type="text" id="name" name="name" required />
        </div>

        <div class="field">
          <label for="designation">2. Designation</label>
          <input type="text" id="designation" name="designation" required />
        </div>

        <div class="field">
          <label for="employeeId">3. Employee ID</label>
          <input type="text" id="employeeId" name="employeeId" required />
        </div>

        <div class="field">
          <label for="gender">4. Male / Female</label>
          <select id="gender" name="gender" required>
            <option value="">Select</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>
        </div>

        <div class="field full-width">
          <label for="office">5. Office</label>
          <input type="text" id="office" name="office" required />
        </div>
      </div>

      <fieldset class="section">
        <legend>6. Expected time of Arrival at Mysore</legend>
        <div class="inline-fields">
          <div class="field">
            <label for="arrivalDate">Date</label>
            <input type="date" id="arrivalDate" name="arrivalDate" required />
          </div>

          <div class="field">
            <label for="arrivalTime">Time</label>
            <input type="time" id="arrivalTime" name="arrivalTime" required />
          </div>

          <div class="field">
            <label for="arrivalMode">Mode of Journey</label>
            <input type="text" id="arrivalMode" name="arrivalMode" placeholder="Air / Bus / Train & No" required />
          </div>
        </div>
      </fieldset>

      <fieldset class="section">
        <legend>7. Expected time of Departure from Mysore</legend>
        <div class="inline-fields">
          <div class="field">
            <label for="departureDate">Date</label>
            <input type="date" id="departureDate" name="departureDate" required />
          </div>

          <div class="field">
            <label for="departureTime">Time</label>
            <input type="time" id="departureTime" name="departureTime" required />
          </div>

          <div class="field">
            <label for="departureMode">Mode of Journey</label>
            <input type="text" id="departureMode" name="departureMode" placeholder="Air / Bus / Train & No" required />
          </div>
        </div>
      </fieldset>

      <div class="form-grid">
        <div class="field">
          <label for="contactNumber">8. Contact Number</label>
          <input type="tel" id="contactNumber" name="contactNumber" required />
        </div>

        <div class="field">
          <label for="email">9. Email ID</label>
          <input type="email" id="email" name="email" required />
        </div>

        <div class="field full-width">
          <label for="suggestions">10. Suggestions / Medications, if any</label>
          <textarea id="suggestions" name="suggestions" rows="5" placeholder="Enter any suggestions or medications"></textarea>
        </div>
      </div>

      <button type="submit">Submit</button>
    </form>

    <div id="successMessage" class="success-message" hidden>
      Your information has been submitted successfully.
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
